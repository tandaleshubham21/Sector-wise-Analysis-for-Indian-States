name: CI - Sectoral Analysis Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:     # Allows manual trigger from GitHub Actions tab

jobs:
  validate-project:
    name: Validate Project Structure & Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml

      - name: Validate Core Files
        run: |
          echo "🔍 Validating project structure..."
          
          # Check essential files
          files=(
            "README.md"
            "LICENSE"
            ".gitignore"
            "sectoral analysis_v2025.3.twbx"
            "project code.sql"
          )
          
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done

      - name: Validate Query Outputs
        run: |
          echo "🔍 Checking Query Outputs folder..."
          ls -la "Query Outputs/" | head -25
          count=$(ls Query\ Outputs/*.csv 2>/dev/null | wc -l)
          echo "📊 Found $count CSV output files"

      - name: Validate Tableau Dashboard
        run: |
          if [ -f "sectoral analysis_v2025.3.twbx" ]; then
            size=$(du -h "sectoral analysis_v2025.3.twbx" | cut -f1)
            echo "✅ Tableau Dashboard found (Size: $size)"
          else
            echo "❌ Tableau Dashboard file is missing!"
            exit 1
          fi

      - name: Generate Project Summary
        run: |
          echo "## 📊 Project Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component              | Status    |" >> $GITHUB_STEP_SUMMARY
          echo "|------------------------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| README.md              | ✅ Present |" >> $GITHUB_STEP_SUMMARY
          echo "| LICENSE                | ✅ Present |" >> $GITHUB_STEP_SUMMARY
          echo "| .gitignore             | ✅ Present |" >> $GITHUB_STEP_SUMMARY
          echo "| Tableau Dashboard      | ✅ Present |" >> $GITHUB_STEP_SUMMARY
          echo "| SQL Queries            | ✅ Present |" >> $GITHUB_STEP_SUMMARY
          echo "| Query Output CSVs      | ✅ $count files |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project is healthy and ready for use!**" >> $GITHUB_STEP_SUMMARY

  lint-and-check:
    name: Basic Quality Checks
    runs-on: ubuntu-latest
    needs: validate-project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for large files
        run: |
          echo "Checking for unexpectedly large files..."
          find . -type f -size +50M | grep -v ".twbx" || echo "No oversized files found (except Tableau workbook)"

      - name: Validate YAML files
        run: |
          echo "Validating workflow files..."
          python -c "
import yaml
import os
for root, dirs, files in os.walk('.github/workflows'):
    for file in files:
        if file.endswith('.yml') or file.endswith('.yaml'):
            path = os.path.join(root, file)
            try:
                with open(path) as f:
                    yaml.safe_load(f)
                print(f'✅ {path} is valid YAML')
            except Exception as e:
                print(f'❌ {path} has YAML error: {e}')
                exit(1)
"