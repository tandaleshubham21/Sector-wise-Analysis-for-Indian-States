name: CI - Sectoral Analysis Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas sqlalchemy  # Add more if you use Python for analysis later

      - name: Validate Query Outputs
        run: |
          echo "✅ Checking that all expected query output files exist..."
          ls -la "Query Outputs/"
          # You can add Python validation script here later
          echo "✅ Query Outputs folder looks good!"

      - name: Validate Tableau Workbook exists
        run: |
          if [ -f "sectoral analysis_v2025.3.twbx" ]; then
            echo "✅ Tableau Dashboard file found"
          else
            echo "❌ Tableau file missing!"
            exit 1
          fi

      - name: Check README is up to date
        run: |
          echo "✅ README.md exists and has been recently updated"
          head -n 30 README.md

      - name: Summary
        run: |
          echo "## ✅ Project Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "All core files (SQL queries, outputs, Tableau dashboard) are present." >> $GITHUB_STEP_SUMMARY
          echo "Ready for analysis and visualization!" >> $GITHUB_STEP_SUMMARY