name: Auto-Update README with Last Validation Time

on:
  workflow_dispatch:   # Manual trigger
  workflow_run:
    workflows: ["CI - Sectoral Analysis Project"]
    types:
      - completed
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README timestamp
        run: |
          python .github/scripts/update_readme_timestamp.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No changes detected in README"
          else
            git add README.md
            git commit -m "chore: Auto-update last validation time in README [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            echo "✅ README updated and pushed successfully"
          fi