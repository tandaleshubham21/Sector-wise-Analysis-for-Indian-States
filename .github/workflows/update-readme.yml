name: Auto-Update README with Last Validation Time

on:
  workflow_dispatch:   # Manual trigger from Actions tab
  workflow_run:
    workflows: ["CI - Sectoral Analysis Project"]
    types:
      - completed
    branches: [ main ]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current timestamp
        id: timestamp
        run: echo "time=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Update README timestamp
        run: |
          python3 -c "
import re
with open('README.md', 'r', encoding='utf-8') as f:
    content = f.read()

new_time = '${{ steps.timestamp.outputs.time }}'

# Replace existing marker
pattern = r'<!-- LAST_VALIDATED: -->.*?<!-- /LAST_VALIDATED -->'
replacement = f'<!-- LAST_VALIDATED: -->**{new_time}** <!-- /LAST_VALIDATED -->'

if re.search(pattern, content):
    content = re.sub(pattern, replacement, content)
else:
    # Append new section if marker not found
    content += f'\n\n---\n\n<!-- LAST_VALIDATED: -->**{new_time}** <!-- /LAST_VALIDATED -->\n'

with open('README.md', 'w', encoding='utf-8') as f:
    f.write(content)
print('README updated successfully with timestamp:', new_time)
"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No changes detected in README"
          else
            git add README.md
            git commit -m "chore: Auto-update last validation time in README [skip ci]"
            git push
            echo "README updated and pushed successfully"
          fi